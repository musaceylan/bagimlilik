// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The generated Cordova module's test dependencies mix pre/post Kotlin 1.8
// stdlib variants. Align them without editing files regenerated by cap sync.
project(':capacitor-cordova-android-plugins') {
    pluginManager.withPlugin('com.android.library') {
        dependencies {
            androidTestImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
